[package]
name = "shannon-kiosk"
version = "0.1.0"
edition = "2021"
description = "Bedroom Shannon kiosk UI — retro-themed, Xbox-controller-driven menu"
authors = ["Fredrik Branstrom"]
license = "AGPL-3.0-or-later"

[dependencies]
# Bevy: game-engine for the retro-themed UI.
# default-features = true gives gamepad support (bevy_gilrs), text rendering,
# windowing (winit), 2D rendering, asset loading. Trim later if too heavy.
bevy = { version = "0.14", default-features = false, features = [
    "animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",         # gamepad input — first-class Xbox controller
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",       # built-in font so we boot before a custom font is loaded
    "x11",                # X11 backend via Xwayland under cage — REQUIRED on
                          # Shannon (Mali T860 + Mesa Panfrost). Cannot use
                          # native Wayland here: wgpu-hal's create_surface
                          # re-inits the EGL context for Wayland windows
                          # (gfx-rs/gfx#3545), which terminates the display
                          # that AdapterContext holds a cloned reference to,
                          # then panics with BAD_DISPLAY at egl.rs:296.
                          # See vendored/wgpu-hal-0.21.1-mali-fix/src/gles/
                          # egl.rs ~line 1025 for the broken upstream branch.
                          # X11/Xwayland path hits the empty Xlib/Xcb branch
                          # in the same function and works cleanly.
    # "wayland",          # DISABLED — see x11 note above. Mac Mini dev runs
                          # under macOS (Metal backend), not affected.
    "tonemapping_luts",
    "webgl2",
    "jpeg",               # JPEG decoder — required for Slice 3c step 2's
                          # `sarpetorp-clock-bg.jpg`. Without this, Shannon
                          # panics in setup_background. Surfaced 2026-05-20.
] }

# --- Slice 2: shannon-kiosk-actions daemon ONLY ---
# Used solely by src/bin/shannon-kiosk-actions.rs. The library
# (context + ha) stays std-only, so `cargo test --lib` / `clippy --lib`
# never compile these (Slice 1's fast pure core is preserved). rustls
# (not OpenSSL) keeps the eventual aarch64 cross-compile clean.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# zune-core only ships 0.5.0-rcN on crates.io (no stable 0.5.0). The
# Bevy 0.14 `jpeg` feature → `zune-jpeg` → `zune-core ^0.5.0` would
# fail to resolve without this prerelease opt-in. Pinning to rc2 (the
# latest known-good). Without this, `cargo build` errors out with
# "candidate versions found which didn't match" for zune-core.
zune-core = "=0.5.0-rc2"

# Performance profile for release — Bevy is heavy without optimizations
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dev: enable optimizations on dependencies (Bevy is too slow in pure debug)
[profile.dev.package."*"]
opt-level = 3

# Vendor-patch wgpu-hal 0.21.1 with retry-loop fallback on robustness
# context creation (backport of upstream wgpu PRs #7952 + #9153). Unlocks
# HW-accelerated GLES on Mali Midgard (Panfrost arch 5) — required for
# Shannon's RK3399 Mali T860 GPU. The patch is conditionally compiled in
# the GLES path (egl.rs is only built on Unix-with-GL), so Mac Mini
# native Metal builds are unaffected.
#
# Full diagnosis: ~/dotfiles/docs/bedroom_kiosk_gpu_research_2026_05_06.md
# Patch lives at: vendored/wgpu-hal-0.21.1-mali-fix/src/gles/egl.rs (search
# "BEGIN mali-fix patch" inside the file).
[patch.crates-io]
wgpu-hal = { path = "vendored/wgpu-hal-0.21.1-mali-fix" }
