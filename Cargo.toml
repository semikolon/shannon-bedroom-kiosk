[package]
name = "shannon-kiosk"
version = "0.1.0"
edition = "2021"
description = "Bedroom Shannon kiosk UI — retro-themed, Xbox-controller-driven menu"
authors = ["Fredrik Branstrom"]
license = "AGPL-3.0-or-later"

[dependencies]
# Bevy: game-engine for the retro-themed UI.
# default-features = true gives gamepad support (bevy_gilrs), text rendering,
# windowing (winit), 2D rendering, asset loading. Trim later if too heavy.
bevy = { version = "0.18.1", default-features = false, features = [
    # Bevy 0.18 renamed `animation` → `bevy_animation` and split rendering
    # into `bevy_<X>_render` sub-features. We don't use animation; drop it.
    # Sprite/UI now need both the data + render counterparts.
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",          # gamepad input — first-class Xbox controller
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",  # Bevy 0.18 split: render half of sprite pipeline
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",      # Bevy 0.18 split: render half of UI
    "bevy_winit",
    "default_font",        # built-in font so we boot before a custom font is loaded
    "x11",                 # X11 backend via Xwayland under cage — historically
                           # REQUIRED on Shannon (Mali T860 + Mesa Panfrost) via
                           # the vendored wgpu-hal 0.21 patch's create_surface
                           # fix (gfx-rs/gfx#3545). Verify under wgpu 27 whether
                           # the X11/Xwayland workaround is still strictly
                           # required, or if Wayland now works upstream.
    # "wayland",           # DISABLED historically; revisit per the x11 note.
    "tonemapping_luts",
    "webgl2",
    "zstd_rust",          # Bevy 0.18's bevy_image now requires explicit zstd
                          # backend choice (zstd_rust = pure-Rust, no C compiler
                          # needed; preferred for cross-compile portability).
] }

# --- Slice 2: shannon-kiosk-actions daemon ONLY ---
# Used solely by src/bin/shannon-kiosk-actions.rs. The library
# (context + ha) stays std-only, so `cargo test --lib` / `clippy --lib`
# never compile these (Slice 1's fast pure core is preserved). rustls
# (not OpenSSL) keeps the eventual aarch64 cross-compile clean.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Performance profile for release — Bevy is heavy without optimizations
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dev: enable optimizations on dependencies (Bevy is too slow in pure debug)
[profile.dev.package."*"]
opt-level = 3

# Vendor-patch for wgpu-hal: DISABLED 2026-05-20 during the Bevy 0.14 →
# 0.18.1 upgrade. The vendored crate at vendored/wgpu-hal-0.21.1-mali-fix
# is wgpu-hal 0.21.x; Bevy 0.18.1 pulls wgpu-hal 27.x. The Cargo `[patch]`
# block would silently no-op, masking whether Mali HW-GLES actually
# works on the new wgpu. First-pass strategy: build Bevy 0.18 without
# the patch, deploy to Shannon, capture fb0, and observe. If Mali
# HW-GLES still works (wgpu upstream PRs may have improved the path
# enough to obviate our 4 patches), we ship without any vendor crate.
# If Mali breaks, port the 4 patches to wgpu-hal 27 and re-enable.
#
# Original vendor patch's diagnosis: ~/dotfiles/docs/bedroom_kiosk_gpu_research_2026_05_06.md
# Vendored crate kept at vendored/wgpu-hal-0.21.1-mali-fix/ for reference
# until Mali outcome is known; will be removed (or replaced with -27)
# once verified.
#
# [patch.crates-io]
# wgpu-hal = { path = "vendored/wgpu-hal-0.21.1-mali-fix" }
